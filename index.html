<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fbfaf7">
<title>HomeFeel Stays • Guest Guide</title>
<style>
:root{--bg:#f7f5f0;--text:#171717;--muted:#77736b;--line:#e4e0d8;--accent:#b08a45;--soft:#fbfaf7}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100vh;background:linear-gradient(180deg,#f4f1ea 0%,#fbfaf7 28%,#f7f5f0 100%)}.app{max-width:560px;margin:auto;min-height:100vh;background:var(--soft);box-shadow:0 0 55px rgba(35,30,20,.07)}
.header{text-align:center;padding:54px 28px 34px;position:relative}.header:before{content:"";display:block;width:42px;height:1px;background:var(--accent);margin:0 auto 22px}.header h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:46px;letter-spacing:-1px;line-height:1.05;margin:0 0 13px}.header p{text-transform:uppercase;letter-spacing:5px;font-size:10px;font-weight:600;margin:0;color:#5f5b54}.header .brand{margin-top:18px;font-size:10px;letter-spacing:2.5px;color:#a07b3e;text-transform:uppercase}
.menu{margin:0 16px 18px;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:rgba(255,255,255,.76);box-shadow:0 14px 35px rgba(30,25,15,.055)}.item{width:100%;display:flex;align-items:center;gap:17px;padding:20px 20px;background:rgba(255,255,255,.72);border:0;border-bottom:1px solid var(--line);text-align:left;color:var(--text);cursor:pointer;transition:background .2s,transform .2s}.item:last-child{border-bottom:0}.item:active{background:#f4f1eb;transform:scale(.995)}
.icon{width:44px;height:44px;display:grid;place-items:center;flex:0 0 44px;border:1px solid #d8d2c7;border-radius:50%;font-size:18px;color:#8f6d36;background:#fcfaf6}.item-text{flex:1}.item-title{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;letter-spacing:.2px;font-weight:700;margin-bottom:5px}.item-sub{font-size:12px;color:var(--muted);letter-spacing:.1px}.arrow{font-family:Georgia,serif;font-size:27px;font-weight:300;color:#9a958c;line-height:1}
.detail{display:none;min-height:100vh}.detail.active{display:block}.home.hidden{display:none}
.detail-top{display:flex;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);z-index:2}
.back{border:0;background:none;font-size:15px;padding:8px 8px 8px 0;cursor:pointer;color:#333}.detail-title{font-size:17px;font-weight:700;margin:auto;padding-right:45px}
.detail-hero{text-align:center;padding:48px 24px 28px}.detail-hero .big-icon{width:72px;height:72px;border:1px solid #ddd;border-radius:50%;display:grid;place-items:center;margin:0 auto 22px;font-size:31px}.detail-hero h2{font-family:Georgia,serif;font-size:38px;font-weight:500;margin:0 0 10px}.detail-hero p{color:var(--muted);margin:0;font-size:14px}
.info{margin:0 20px 24px;border:1px solid #ededed;border-radius:18px;overflow:hidden}.row{padding:20px;border-bottom:1px solid #ededed}.row:last-child{border-bottom:0}.label{text-transform:uppercase;letter-spacing:3px;font-size:10px;font-weight:700;color:#777;margin-bottom:10px}.value{font-size:17px;line-height:1.6}.value strong{font-weight:700}.note{font-size:12px;color:#777;margin-top:10px;line-height:1.5}
.actions{padding:0 20px 28px}.btn{display:block;text-align:center;text-decoration:none;background:#111;color:#fff;border-radius:14px;padding:14px;margin-top:10px;font-weight:600}.btn.gold{background:var(--accent)}
.benefit{margin:0 20px 16px;padding:22px;border:1px solid var(--line);border-radius:20px;background:#fffdfa;box-shadow:0 8px 25px rgba(30,25,15,.04)}.benefit h3{font-family:Georgia,serif;font-size:23px;font-weight:500;margin:0 0 8px}.benefit p{font-size:14px;line-height:1.6;color:#555;margin:0 0 15px}.benefit .badge{display:inline-block;border:1px solid #d7b66e;color:#8d6b31;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}.benefit .btn{margin-top:8px}
.footer{text-align:center;color:#aaa49a;font-size:10px;letter-spacing:.7px;padding:22px 20px 30px}
@media(max-width:390px){.header{padding-top:44px}.header h1{font-size:40px}.header p{letter-spacing:4px}.item{padding:18px}.menu{margin-left:12px;margin-right:12px;border-radius:21px}}
</style>
</head>
<body>
<div class="app">
<div id="home" class="home">
<header class="header"><h1>Welcome</h1><p>ENJOY YOUR STAY</p><div class="brand">HomeFeel Stays • Guest Concierge</div></header>
<nav class="menu">
<button class="item" onclick="openDetail('wifi')"><span class="icon">⌁</span><span class="item-text"><span class="item-title">WI-FI</span><span class="item-sub">Network and password</span></span><span class="arrow">›</span></button>
<button class="item" onclick="openDetail('checkin')"><span class="icon">🔑</span><span class="item-text"><span class="item-title">Check In/Out</span><span class="item-sub">Arrival and departure</span></span><span class="arrow">›</span></button>
<button class="item" onclick="openDetail('amenities')"><span class="icon">▣</span><span class="item-text"><span class="item-title">Amenities</span><span class="item-sub">What we provide</span></span><span class="arrow">›</span></button>
<button class="item" onclick="openDetail('know')"><span class="icon">ⓘ</span><span class="item-text"><span class="item-title">Things to Know</span><span class="item-sub">Helpful tips</span></span><span class="arrow">›</span></button>
<button class="item" onclick="openDetail('directions')"><span class="icon">⌾</span><span class="item-text"><span class="item-title">Directions</span><span class="item-sub">Finding us</span></span><span class="arrow">›</span></button>
<button class="item" onclick="openDetail('explore')"><span class="icon">◫</span><span class="item-text"><span class="item-title">Explore the Area</span><span class="item-sub">Eat, see and do</span></span><span class="arrow">›</span></button>
<button class="item" onclick="openDetail('rules')"><span class="icon">▤</span><span class="item-text"><span class="item-title">House Rules</span><span class="item-sub">For a pleasant stay</span></span><span class="arrow">›</span></button>
<button class="item" onclick="openDetail('benefits')"><span class="icon">♢</span><span class="item-text"><span class="item-title">Guest Benefits</span><span class="item-sub">Exclusive perks for you</span></span><span class="arrow">›</span></button>
<button class="item" onclick="openDetail('before')"><span class="icon">✓</span><span class="item-text"><span class="item-title">Before You Go</span><span class="item-sub">Quick check-out checklist</span></span><span class="arrow">›</span></button>
</nav>
<div class="footer">Guest information • Mobile friendly • Available 24/7</div>
</div>

<div id="detail" class="detail">
<div class="detail-top"><button class="back" onclick="goHome()">‹ Back</button><div id="detailTitle" class="detail-title"></div></div>
<div id="detailContent"></div>
</div>
</div>

<script>
const data={
wifi:{title:'Wi-Fi',body:`<div class="detail-hero"><div class="big-icon">⌁</div><h2>Free WiFi</h2><p>Stay connected throughout your stay.</p></div><div class="info"><div class="row"><div class="label">Network</div><div class="value"><strong>UrbanNest_Guest</strong></div></div><div class="row"><div class="label">Password</div><div class="value"><strong>Welcome@123</strong></div></div></div>`},
checkin:{title:'Check In/Out',body:`<div class="detail-hero"><div class="big-icon">🔑</div><h2>Arrival Info</h2><p>Everything you need for a smooth arrival.</p></div><div class="info"><div class="row"><div class="label">Check-in</div><div class="value"><strong>2:00 PM</strong></div></div><div class="row"><div class="label">Check-out</div><div class="value"><strong>11:00 AM</strong></div></div><div class="row"><div class="label">Access</div><div class="value">Self check-in using the smart lock.</div><div class="note">Dummy door code: 2580# — replace before guest use.</div></div></div>`},
amenities:{title:'Amenities',body:`<div class="detail-hero"><div class="big-icon">▣</div><h2>Amenities</h2><p>Everything provided for a comfortable stay.</p></div><div class="info"><div class="row"><div class="value">• Air conditioning<br>• High-speed Wi-Fi<br>• Smart TV<br>• Hot water<br>• Refrigerator<br>• Washing machine<br>• Fully equipped kitchen<br>• Towels and basic toiletries<br>• Iron and ironing board<br>• Free parking</div></div></div>`},
know:{title:'Things to Know',body:`<div class="detail-hero"><div class="big-icon">ⓘ</div><h2>Things to Know</h2><p>A few helpful tips for your stay.</p></div><div class="info"><div class="row"><div class="label">Electricity</div><div class="value">Please switch off AC and lights when leaving.</div></div><div class="row"><div class="label">Hot Water</div><div class="value">Hot water is available through the geyser.</div></div><div class="row"><div class="label">Support</div><div class="value">Contact the host if you need assistance.</div></div></div><div class="actions"><a class="btn" href="tel:+919876543210">📞 Call Host</a><a class="btn gold" href="https://wa.me/919876543210">💬 WhatsApp Host</a></div>`},
directions:{title:'Directions',body:`<div class="detail-hero"><div class="big-icon">⌾</div><h2>Find Us</h2><p>Getting here made simple.</p></div><div class="info"><div class="row"><div class="label">Property</div><div class="value">Urban Nest, Gachibowli, Hyderabad</div></div><div class="row"><div class="label">Landmark</div><div class="value">Near Main Road / Central Mall</div><div class="note">Dummy address — replace with your exact address.</div></div></div><div class="actions"><a class="btn" target="_blank" href="https://www.google.com/maps/search/?api=1&query=Gachibowli%2C%20Hyderabad">🗺️ Open in Google Maps</a></div>`},
explore:{title:'Explore the Area',body:`<div class="detail-hero"><div class="big-icon">◫</div><h2>Explore the Area</h2><p>Eat, see and do nearby.</p></div><div class="info"><div class="row"><div class="value"><strong>🍽️ Restaurants</strong><br>Local restaurants and cafés within 5–10 minutes.</div></div><div class="row"><div class="value"><strong>🛒 Shopping</strong><br>Supermarkets and convenience stores nearby.</div></div><div class="row"><div class="value"><strong>☕ Cafés</strong><br>Popular coffee shops around Gachibowli.</div></div><div class="row"><div class="value"><strong>🏥 Pharmacy</strong><br>24/7 pharmacy available nearby.</div></div><div class="row"><div class="value"><strong>🚇 Metro</strong><br>Raidurg Metro Station — approximately 10–15 minutes by car.</div></div></div>`},
rules:{title:'House Rules',body:`<div class="detail-hero"><div class="big-icon">▤</div><h2>House Rules</h2><p>Please help us keep the property comfortable for everyone.</p></div><div class="info"><div class="row"><div class="value">• No parties or events.<br>• No smoking inside.<br>• Keep noise reasonable, especially after 10 PM.<br>• No additional guests without approval.<br>• Treat furniture and appliances with care.<br>• Report damage promptly.<br>• Do not move furniture between rooms.</div></div></div>`},
benefits:{title:'Guest Benefits',body:`<div class="detail-hero"><div class="big-icon">♢</div><h2>Guest Benefits</h2><p>Exclusive perks for our guests.</p></div><div class="benefit"><span class="badge">10% OFF</span><h3>Book Direct & Save</h3><p>Planning your next stay? Book directly with HomeFeel Stays and enjoy <strong>10% off your next stay.</strong></p><a class="btn gold" href="#">Book Direct</a></div><div class="benefit"><span class="badge">Instagram</span><h3>Stay Connected</h3><p>Follow HomeFeel Stays on Instagram for new properties, updates and special offers.</p><a class="btn" href="#" target="_blank">Follow on Instagram</a><div class="note">Giveaway: follow our Instagram for a chance to win 2 complimentary stays. Terms & eligibility apply.</div></div><div class="benefit"><span class="badge">Your Feedback Matters</span><h3>Enjoyed Your Stay?</h3><p>We’d love to hear about your experience. Your honest feedback helps us improve and helps future guests.</p><a class="btn" href="#">Leave a Review</a></div>`},
before:{title:'Before You Go',body:`<div class="detail-hero"><div class="big-icon">✓</div><h2>Before You Go</h2><p>A quick checklist before leaving.</p></div><div class="info"><div class="row"><div class="value">☐ Check your belongings.<br>☐ Switch off lights and AC.<br>☐ Close windows and taps.<br>☐ Dispose of food and waste.<br>☐ Lock the main door.<br>☐ Complete check-out instructions.<br>☐ Message the host after leaving.</div></div></div>`}
};
function openDetail(id,replace=false){const x=data[id];if(!x)return;document.getElementById('home').classList.add('hidden');document.getElementById('detailTitle').textContent=x.title;document.getElementById('detailContent').innerHTML=x.body;document.getElementById('detail').classList.add('active');window.scrollTo(0,0);if(replace)history.replaceState({page:id},'', '#'+id);else history.pushState({page:id},'', '#'+id)}
function goHome(){document.getElementById('detail').classList.remove('active');document.getElementById('home').classList.remove('hidden');window.scrollTo(0,0);history.pushState({},'',location.pathname)}
window.addEventListener('popstate',()=>{const id=location.hash.slice(1);if(data[id])openDetail(id,true);else{document.getElementById('detail').classList.remove('active');document.getElementById('home').classList.remove('hidden');}});
window.addEventListener('DOMContentLoaded',()=>{const id=location.hash.slice(1);if(data[id])openDetail(id,true)});
</script>
</body>
</html>
