.home-intro{

  background:#C9A96B;
  opacity:.82;
}
.menu{
  position:relative;
  z-index:3;
  margin:20px var(--page-padding) 0;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));

}
.item{
  width:100%;
  min-height:65px;
  padding:8px 9px;
  display:flex;
  align-items:center;
  gap:9px;
  border:1px solid rgba(228,222,210,.82);
  border-radius:13px;
  background:rgba(255,255,255,.94);
  color:var(--text);
  text-align:left;
  cursor:pointer;
  box-shadow:0 2px 11px rgba(40,32,20,.035),0 1px 0 rgba(255,255,255,.95) inset;

.item-icon svg{

function render(id,replace){const x=data[id];if(!x)return;document.getElementById('home').style.display='none';const d=document.getElementById('detail');d.classList.toggle('checkout-detail',id==='checkout');d.classList.toggle('amenities-detail',id==='amenities');d.classList.toggle('explore-detail',id==='explore');const hero=x.hero?'<div class="checkout-hero"><img src="'+x.hero+'" alt="Bedroom with a thank-you card"></div>':'';d.innerHTML=hero+'<div class="detail-top"><div class="kicker">'+x.kicker+'</div>'+(x.title?'<h1>'+x.title+'</h1>':'')+'<div class="detail-icon">'+x.icon+'</div></div><div class="content">'+x.html+'</div><button class="back" onclick="goHome()" aria-label="Back">'+icons.back+'</button><button class="menu-fab" onclick="goHome()" aria-label="Guest guide menu">'+icons.menu+'</button>';d.classList.add('active');window.scrollTo(0,0);if(replace)history.replaceState({page:id},'',location.pathname+'#'+id);else history.pushState({page:id},'',location.pathname+'#'+id)}

<style>
.qr-modal{position:fixed;inset:0;z-index:1000;display:none;align-items:flex-end;justify-content:center;background:rgba(15,59,50,.28);padding:16px}
.qr-modal.open{display:flex}
.qr-sheet{position:relative;width:min(100%,390px);padding:27px 20px 22px;border:1px solid #E4DED2;border-radius:22px 22px 18px 18px;background:#FAF7EF;text-align:center;box-shadow:0 14px 45px rgba(30,25,18,.16)}
.qr-close{position:absolute;right:14px;top:10px;width:34px;height:34px;border:0;background:transparent;color:#0F3B32;font-size:27px;font-weight:300;cursor:pointer}
.qr-kicker{font-size:9px;letter-spacing:3px;color:#9A7538;font-weight:700}
.qr-sheet h2{margin:8px 0 5px;font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;line-height:1;color:#0F3B32;font-weight:400}
.qr-description{margin:0 0 17px;font-size:11px;color:#6B6B6B}
.qr-code-wrap{display:grid;place-items:center;width:250px;height:250px;margin:0 auto 13px;background:#fff;border:1px solid #E4DED2;border-radius:14px}
#guestQrCanvas{width:230px;height:230px;image-rendering:pixelated}
.qr-url{font-size:9px;color:#756F67;letter-spacing:.4px;word-break:break-all;margin-bottom:15px}
.qr-download{min-height:44px;width:100%;border:1px solid #0F3B32;border-radius:11px;background:#0F3B32;color:#fff;font-size:11px;font-weight:650;cursor:pointer}
@media(min-width:700px){.qr-modal{align-items:center}.qr-sheet{border-radius:22px}}
</style>
<script>
const GUEST_GUIDE_URL="https://anjan9573.github.io/digital-guest-guide/";
function openQrGenerator(){
  const modal=document.getElementById("qr-generator");
  modal.classList.add("open");
  modal.setAttribute("aria-hidden","false");
  drawGuestQr();
}
function closeQrGenerator(){
  const modal=document.getElementById("qr-generator");
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden","true");
}
function drawGuestQr(){
  const canvas=document.getElementById("guestQrCanvas");
  if(!canvas)return;
  const ctx=canvas.getContext("2d");
  const size=230;
  canvas.width=size; canvas.height=size;
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,size,size);
  if(window.QRCode){
    QRCode.toCanvas(canvas,GUEST_GUIDE_URL,{width:size,margin:2,color:{dark:"#0F3B32",light:"#FFFFFF"}});
  }
}
function downloadGuestQr(){
  const canvas=document.getElementById("guestQrCanvas");
  if(!canvas)return;
  const link=document.createElement("a");
  link.download="homefeel-stays-guest-guide-qr.png";
  link.href=canvas.toDataURL("image/png");
  link.click();
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeQrGenerator()});
document.addEventListener("click",e=>{
  const modal=document.getElementById("qr-generator");
  if(e.target===modal)closeQrGenerator();
});
</script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
