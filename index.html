<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbfaf7">
<meta name="description" content="HomeFeel Stays digital guest guide">
<title>HomeFeel Stays • Guest Guide</title>
<style>
:root{--bg:#fbfaf7;--surface:#fffefa;--ink:#171716;--muted:#68645d;--soft:#f3f1eb;--line:#dedbd4;--accent:#a68145;--accent-soft:#eee5d5}
*{box-sizing:border-box}html{background:#eceae5}body{margin:0;min-height:100vh;background:#eceae5;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}button,a{font:inherit}button{appearance:none}
.app{width:100%;max-width:430px;min-height:100vh;margin:auto;background:var(--bg);overflow:hidden;box-shadow:0 0 45px rgba(0,0,0,.08)}
.home{position:relative;min-height:100vh;background:#faf8f2;overflow:hidden}
.home-header{position:relative;height:520px;padding:calc(30px + env(safe-area-inset-top)) 24px 0;text-align:center;overflow:hidden;background-image:linear-gradient(180deg,rgba(24,18,12,.18) 0%,rgba(255,250,240,.02) 44%,rgba(250,248,242,.94) 92%,#faf8f2 100%),url("https://static.333travel.nl/web-images/09/2023/650309a00e5f4/Oman-Jumeirah-Muscat-Bay-Junior-One-Bedroom-Suite-woonkamer.jpg");background-size:cover;background-position:center top}
.brand-lockup{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;color:#111;margin-top:64px}
.house-logo{width:57px;height:57px;margin-bottom:7px}
.house-logo svg{width:100%;height:100%}
.brand-name{font-family:Georgia,"Times New Roman",serif;font-size:25px;line-height:1.05;letter-spacing:-.8px}
.brand-tagline{font-size:8px;letter-spacing:3.2px;font-weight:700;margin-top:8px}
.menu-float-home{position:absolute;z-index:4;right:20px;top:calc(28px + env(safe-area-inset-top));width:58px;height:58px;border:0;border-radius:50%;background:rgba(255,253,248,.94);color:#222;display:grid;place-items:center;box-shadow:0 5px 18px rgba(0,0,0,.08);cursor:pointer}
.menu-float-home svg{width:28px;height:28px}
.home-header h1{position:absolute;z-index:2;left:0;right:0;bottom:92px;font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:64px;line-height:.95;margin:0;letter-spacing:-2.7px;color:#080808}
.home-header .rule{position:absolute;z-index:2;bottom:67px;left:50%;transform:translateX(-50%);width:42px;height:3px;background:#b18a48;margin:0}
.home-header .subtitle{position:absolute;z-index:2;left:0;right:0;bottom:37px;font-size:10px;letter-spacing:5px;font-weight:600;margin:0;color:#4d4a45}
.menu{position:relative;z-index:3;margin:-2px 18px 0;border:1px solid #e4dfd5;border-radius:19px;background:rgba(255,253,248,.82);box-shadow:0 8px 24px rgba(60,48,32,.035);overflow:hidden;backdrop-filter:blur(8px)}
.item{width:100%;min-height:94px;padding:11px 14px 11px 12px;display:flex;align-items:center;gap:18px;border:0;border-bottom:1px solid #e7e2d9;background:transparent;color:#111;text-align:left;cursor:pointer}.item:last-child{border-bottom:0}.item:active{background:#f4efe7}
.item-icon{width:58px;height:58px;flex:0 0 58px;display:grid;place-items:center;color:#111;background:#f3eadb;border-radius:16px}.item-icon svg{width:36px;height:36px;stroke-width:1.45}.item-copy{flex:1;min-width:0}.item-title{font-size:17px;font-weight:500;line-height:1.2;letter-spacing:-.2px}.item-sub{display:block;font-size:13px;color:#6e6a64;margin-top:6px;line-height:1.25}.arrow{font-size:33px;line-height:1;color:#252525;font-family:Arial,sans-serif;font-weight:300;padding-right:1px}
.home-footer{text-align:center;padding:27px 20px calc(27px + env(safe-area-inset-bottom));font-size:9px;letter-spacing:4px;color:#858078;text-transform:uppercase}.home-footer:before{content:"";display:block;width:42px;height:2px;background:#b18a48;margin:0 auto 17px}.home-footer span{display:none}
.detail{display:none;min-height:100vh;background:var(--bg);padding-bottom:90px}.detail.active{display:block}.detail-top{padding:calc(17px + env(safe-area-inset-top)) 20px 0;text-align:center}.detail-top .kicker{font-size:9px;letter-spacing:3.5px;font-weight:800;color:#67635c}.detail-top h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:36px;line-height:1.08;letter-spacing:-1px;margin:15px 0 0}.detail-icon{width:68px;height:68px;border:1px solid #d6d1c7;border-radius:50%;background:var(--surface);display:grid;place-items:center;margin:23px auto 20px;color:#77736c;box-shadow:0 4px 16px rgba(0,0,0,.04)}.detail-icon svg{width:31px;height:31px}.content{padding:0 20px}.hero-card{border-radius:15px;overflow:hidden;border:1px solid var(--line);margin:0 0 20px}.hero-card img{display:block;width:100%;height:158px;object-fit:cover}.intro{text-align:center;font-size:12px;line-height:1.65;color:#55514a;margin:0 auto 20px;max-width:330px}
.info-card,.list,.checklist,.map-card,.credential,.big-time{background:var(--surface);border:1px solid var(--line);border-radius:15px}.list{padding:0 16px}.list-item{display:flex;gap:13px;padding:15px 0;border-bottom:1px solid var(--line);font-size:11px;line-height:1.5}.list-item:last-child{border-bottom:0}.list-icon{width:27px;flex:0 0 27px;color:#817d75}.list-icon svg{width:22px;height:22px}.list-item b{display:block;font-size:12px;margin-bottom:3px}.list-item span{color:#656058}
.big-time{text-align:center;padding:20px 12px;margin-bottom:14px}.label{display:block;font-size:9px;letter-spacing:2.5px;color:#817b72;font-weight:800;margin-bottom:8px}.big-time strong{font-family:Georgia,serif;font-size:38px;font-weight:400}.credential{text-align:center;padding:18px;margin-bottom:12px}.credential .pill{min-width:190px}.pill{display:inline-flex;align-items:center;justify-content:center;background:#171716;color:#fff;border-radius:30px;padding:10px 18px;font-size:13px;font-weight:650;letter-spacing:.4px}.actions{display:flex;gap:9px;margin:12px 0 17px}.action{flex:1;min-height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:11px;font-weight:750;cursor:pointer}.dark{background:#171716;color:#fff;border:1px solid #171716}.light{background:var(--surface);color:#6f532b;border:1px solid #cdbb99}.note{background:var(--accent-soft);border:1px solid #e5dac7;border-radius:14px;padding:14px 15px;font-size:11px;line-height:1.55;color:#5d554a;margin-top:15px}.note b{color:#89682f}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.amenity{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px}.amenity svg{width:25px;height:25px;color:#817d75;margin-bottom:8px}.amenity span{font-size:10px;line-height:1.3;color:#4e4a44}.checklist{padding:0 16px}.check{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:11px}.check:last-child{border-bottom:0}.check-mark{width:23px;height:23px;border:1px solid #c7b48e;border-radius:50%;display:grid;place-items:center;color:#92703a;flex:0 0 23px;font-size:11px}.map-card{padding:17px;margin-bottom:11px}.map-card strong{display:block;font-size:14px;line-height:1.45}.map-card small{display:block;color:var(--muted);font-size:10px;margin-top:5px}
.full-action{width:100%;min-height:46px;margin-bottom:16px}.tabs{display:flex;gap:4px;background:#eeece6;border-radius:11px;padding:4px;margin-bottom:13px}.tabs button{flex:1;border:0;background:transparent;border-radius:8px;padding:9px 2px;color:#77736b;font-size:9px}.tabs button.active{background:var(--surface);color:#1b1a18;font-weight:750;box-shadow:0 2px 8px rgba(0,0,0,.06)}.tab{display:none}.tab.active{display:block}.place{display:flex;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:9px}.place img{width:65px;height:65px;object-fit:cover;border-radius:10px;flex:0 0 65px}.place b{font-size:11px}.place span{display:block;font-size:10px;color:var(--muted);margin-top:5px;line-height:1.4}.place small{display:block;font-size:9px;color:#98733b;font-weight:750;margin-top:6px}.thanks{text-align:center;background:var(--accent-soft);border:1px solid #e5dac7;border-radius:15px;padding:18px;margin-top:18px;font-family:Georgia,serif;font-size:14px;line-height:1.55}.thanks span{color:var(--accent)}
.back,.menu-fab{position:fixed;z-index:30;bottom:18px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.12)}.back{left:max(17px,calc((100vw - 430px)/2 + 17px));border:1px solid #d6d2c9;background:#fffefa;color:#2b2926}.menu-fab{right:max(17px,calc((100vw - 430px)/2 + 17px));border:1px solid #222;background:#171716;color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.16)}.back svg,.menu-fab svg{width:21px;height:21px}
@media(min-width:600px){body{padding:25px 0}.app{border-radius:24px;min-height:850px}}
</style>
</head>
<body>
<div class="app">
<main id="home">
<header class="home-header">
<button class="menu-float-home" onclick="document.querySelector('.menu').scrollIntoView({behavior:'smooth',block:'start'})" aria-label="Open guest guide menu">${icons.menu}</button>
<div class="brand-lockup"><div class="house-logo"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M10 29 32 9l22 20v26H10z"/><path d="M25 55V38c0-4 3-7 7-7s7 3 7 7v17"/></svg></div><div class="brand-name">HomeFeel Stays</div><div class="brand-tagline">STAY · RELAX · BELONG</div></div>
<h1>Welcome</h1><div class="rule"></div><p class="subtitle">ENJOY YOUR STAY</p></header>
<nav class="menu" aria-label="Guest guide">

<button class="item" onclick="openDetail('checkin')"><span class="item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg></span><span class="item-copy"><span class="item-title">Check In / Out</span><span class="item-sub">Arrival and departure</span></span><span class="arrow">›</span></button>
<button class="item" onclick="openDetail('amenities')"><span class="item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7v8a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19z"/><path d="M9 20.5v-6h6v6"/></svg></span><span class="item-copy"><span class="item-title">Amenities</span><span class="item-sub">What we provide</span></span><span class="arrow">›</span></button>
<button class="item" onclick="openDetail('know')"><span class="item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55"><circle cx="12" cy="12" r="8.5"/><path d="M12 10.5v6"/><circle cx="12" cy="7.5" r=".8" fill="currentColor" stroke="none"/></svg></span><span class="item-copy"><span class="item-title">Things to Know</span><span class="item-sub">Helpful tips</span></span><span class="arrow">›</span></button>
<button class="item" onclick="openDetail('directions')"><span class="item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"><path d="M12 21s6-5.2 6-11a6 6 0 1 0-12 0c0 5.8 6 11 6 11Z"/><circle cx="12" cy="10" r="2.2"/></svg></span><span class="item-copy"><span class="item-title">Directions</span><span class="item-sub">Finding us</span></span><span class="arrow">›</span></button>
<button class="item" onclick="openDetail('explore')"><span class="item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linejoin="round"><path d="m4 6 5-2 6 2 5-2v14l-5 2-6-2-5 2z"/><path d="M9 4v14M15 6v14"/></svg></span><span class="item-copy"><span class="item-title">Explore the Area</span><span class="item-sub">Eat, see and do</span></span><span class="arrow">›</span></button>
<button class="item" onclick="openDetail('rules')"><span class="item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4.5h11a2 2 0 0 1 2 2V20H8a2 2 0 0 1-2-2z"/><path d="M6 18a2 2 0 0 1 2-2h11M10 9h6M10 12h6"/></svg></span><span class="item-copy"><span class="item-title">House Rules</span><span class="item-sub">For a pleasant stay</span></span><span class="arrow">›</span></button>
<button class="item" onclick="openDetail('checkout')"><span class="item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="m8 9 1.5 1.5L12 8M8 14l1.5 1.5L12 13M14 10h2M14 15h2"/></svg></span><span class="item-copy"><span class="item-title">Before You Go</span><span class="item-sub">Quick check-out checklist</span></span><span class="arrow">›</span></button>
</nav><footer class="home-footer">HOMEFEEL STAYS</footer>
</main>
<section id="detail" class="detail" aria-live="polite"></section>
</div>
<script>
const icons={
wifi:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"><path d="M3.5 9.5a18 18 0 0 1 17 0"/><path d="M6.5 13a12.5 12.5 0 0 1 11 0"/><path d="M9.5 16.5a7 7 0 0 1 5 0"/><circle cx="12" cy="20" r=".8" fill="currentColor" stroke="none"/></svg>',
clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>',
home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7v8a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19z"/><path d="M9 20.5v-6h6v6"/></svg>',
info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55"><circle cx="12" cy="12" r="8.5"/><path d="M12 10.5v6"/><circle cx="12" cy="7.5" r=".8" fill="currentColor" stroke="none"/></svg>',
pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"><path d="M12 21s6-5.2 6-11a6 6 0 1 0-12 0c0 5.8 6 11 6 11Z"/><circle cx="12" cy="10" r="2.2"/></svg>',
map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linejoin="round"><path d="m4 6 5-2 6 2 5-2v14l-5 2-6-2-5 2z"/><path d="M9 4v14M15 6v14"/></svg>',
rules:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4.5h11a2 2 0 0 1 2 2V20H8a2 2 0 0 1-2-2z"/><path d="M6 18a2 2 0 0 1 2-2h11M10 9h6M10 12h6"/></svg>',
check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="m8 9 1.5 1.5L12 8M8 14l1.5 1.5L12 13M14 10h2M14 15h2"/></svg>',
back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg>'
};
const data={
wifi:{kicker:'STAY CONNECTED',title:'Free WiFi',icon:icons.wifi,html:'<p class="intro">Enjoy complimentary Wi-Fi throughout your stay.</p><div class="credential"><span class="label">NETWORK</span><span class="pill">UrbanNest_Guest</span></div><div class="credential"><span class="label">PASSWORD</span><span id="wifiPassword" class="pill">Welcome@123</span></div><div class="actions"><button class="action dark" onclick="copyPassword()">Copy Password</button><button class="action light" onclick="wifiConnect()">Wi-Fi Details</button></div><div class="note"><b>Tip</b> If the network does not appear, turn Wi-Fi off and on again.</div>'},
checkin:{kicker:'ARRIVAL INFO',title:'Check In',icon:icons.clock,html:'<div class="big-time"><span class="label">CHECK-IN TIME</span><strong>2:00 PM</strong></div><div class="list"><div class="list-item"><div class="list-icon">'+icons.home+'</div><div><b>House Access</b><span>Use the smart lock at the main entrance.</span></div></div><div class="list-item"><div class="list-icon">'+icons.pin+'</div><div><b>Access Code</b><span>2580#</span></div></div><div class="list-item"><div class="list-icon">'+icons.pin+'</div><div><b>Parking</b><span>Free parking is available for guests.</span></div></div></div><div class="note"><b>Early arrival?</b> Please contact us in advance. Early check-in is subject to availability.</div>'},
checkout:{kicker:'BEFORE YOU GO',title:'Check Out',icon:icons.check,html:'<div class="big-time"><span class="label">CHECK-OUT TIME</span><strong>11:00 AM</strong></div><p class="intro">Thank you for staying with HomeFeel Stays. A few small things help us prepare the home for the next guests.</p><div class="checklist"><div class="check"><span class="check-mark">✓</span>Check your belongings</div><div class="check"><span class="check-mark">✓</span>Switch off lights and AC</div><div class="check"><span class="check-mark">✓</span>Close windows and taps</div><div class="check"><span class="check-mark">✓</span>Dispose of food and waste</div><div class="check"><span class="check-mark">✓</span>Lock the main door</div><div class="check"><span class="check-mark">✓</span>Message the host after leaving</div></div><div class="note"><b>Need a late check-out?</b> Let us know and we will do our best to arrange it, subject to availability.</div>'},
amenities:{kicker:'AMENITIES',title:'About the House',icon:icons.home,html:'<div class="hero-card"><img loading="lazy" src="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=900&q=78" alt="Home interior"></div><p class="intro">A comfortable, thoughtfully prepared space with the essentials you need for an easy stay.</p><div class="grid">'+['High-Speed Wi-Fi','Air Conditioning','Smart TV','Hot Water','Refrigerator','Washing Machine','Kitchen','Towels & Toiletries','Iron','Free Parking'].map((x,i)=>'<div class="amenity">'+[icons.wifi,icons.home,icons.clock,icons.home,icons.home,icons.home,icons.home,icons.check,icons.rules,icons.pin][i]+'<span>'+x+'</span></div>').join('')+'</div>'},
know:{kicker:'THINGS TO KNOW',title:'Helpful Tips',icon:icons.info,html:'<p class="intro">A few simple notes to help everything run smoothly during your stay.</p><div class="list"><div class="list-item"><div class="list-icon">'+icons.home+'</div><div><b>Electricity</b><span>Please switch off AC and lights when leaving.</span></div></div><div class="list-item"><div class="list-icon">♨</div><div><b>Hot Water</b><span>Hot water is available through the geyser.</span></div></div><div class="list-item"><div class="list-icon">'+icons.info+'</div><div><b>Support</b><span>Contact your host whenever you need help.</span></div></div></div><div class="actions"><a class="action dark" href="tel:+919876543210">Call Host</a><a class="action light" href="https://wa.me/919876543210" target="_blank" rel="noopener">WhatsApp</a></div>'},
directions:{kicker:'DIRECTIONS',title:'Finding Us',icon:icons.pin,html:'<p class="intro">Your stay is in Gachibowli, Hyderabad, with easy access to the surrounding area.</p><div class="map-card"><span class="label">ADDRESS</span><strong>Urban Nest, Gachibowli, Hyderabad</strong><small>Near Main Road / Central Mall</small></div><a class="action dark full-action" href="https://www.google.com/maps/search/?api=1&query=Gachibowli%2C%20Hyderabad" target="_blank" rel="noopener">Open in Google Maps</a><div class="list"><div class="list-item"><div class="list-icon">🚇</div><div><b>Raidurg Metro</b><span>Approx. 10–15 min by car.</span></div></div><div class="list-item"><div class="list-icon">🚕</div><div><b>Airport / Cab</b><span>Use your preferred ride service.</span></div></div></div>'},
explore:{kicker:'EXPLORE THE AREA',title:'Discover',icon:icons.map,html:'<div class="hero-card"><img loading="lazy" src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=900&q=78" alt="Restaurant nearby"></div><p class="intro">A few nearby ideas for food, coffee, shopping and getting around.</p><div class="tabs"><button class="active" onclick="switchTab(this,\'restaurants\')">Restaurants</button><button onclick="switchTab(this,\'places\')">Places</button><button onclick="switchTab(this,\'shopping\')">Shopping</button></div><div id="restaurants" class="tab active"><div class="place"><img loading="lazy" src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=250&q=70" alt=""><div><b>Local Restaurants</b><span>Everyday dining and delivery options nearby.</span><small>5–10 min</small></div></div><div class="place"><img loading="lazy" src="https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=250&q=70" alt=""><div><b>Popular Cafés</b><span>Coffee, breakfast and casual bites.</span><small>5–15 min</small></div></div></div><div id="places" class="tab"><div class="place"><img loading="lazy" src="https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=250&q=70" alt=""><div><b>Raidurg Metro</b><span>Easy access to Hyderabad business districts.</span><small>10–15 min</small></div></div><div class="place"><img loading="lazy" src="https://images.unsplash.com/photo-1570168007204-dfb528c6958f?auto=format&fit=crop&w=250&q=70" alt=""><div><b>Gachibowli Area</b><span>Business, dining and entertainment.</span><small>Nearby</small></div></div></div><div id="shopping" class="tab"><div class="place"><img loading="lazy" src="https://images.unsplash.com/photo-1601598851547-4302969d0a6a?auto=format&fit=crop&w=250&q=70" alt=""><div><b>Supermarkets</b><span>Daily essentials and groceries.</span><small>5–10 min</small></div></div><div class="place"><img loading="lazy" src="https://images.unsplash.com/photo-1519567241046-7f570eee3ce6?auto=format&fit=crop&w=250&q=70" alt=""><div><b>Shopping</b><span>Malls and retail nearby.</span><small>10–20 min</small></div></div></div>'},
rules:{kicker:'HOUSE RULES',title:'For a Pleasant Stay',icon:icons.rules,html:'<p class="intro">Please help us keep the home comfortable and enjoyable for every guest.</p><div class="list"><div class="list-item"><div class="list-icon">01</div><div><b>No parties or events</b><span>Please keep gatherings within the agreed guest count.</span></div></div><div class="list-item"><div class="list-icon">02</div><div><b>No smoking indoors</b><span>Smoking is not permitted inside the property.</span></div></div><div class="list-item"><div class="list-icon">03</div><div><b>Keep noise reasonable</b><span>Especially after 10 PM.</span></div></div><div class="list-item"><div class="list-icon">04</div><div><b>Approved guests only</b><span>Please do not bring additional guests without approval.</span></div></div><div class="list-item"><div class="list-icon">05</div><div><b>Treat the home with care</b><span>Please use furniture and appliances responsibly.</span></div></div><div class="list-item"><div class="list-icon">06</div><div><b>Report damage promptly</b><span>Tell us as soon as possible if something is damaged.</span></div></div></div><div class="thanks">Thank you for helping us keep <b>HomeFeel Stays</b> special. <span>♥</span></div>'}
};
function render(id,replace){const x=data[id];if(!x)return;document.getElementById('home').style.display='none';const d=document.getElementById('detail');d.innerHTML='<div class="detail-top"><div class="kicker">'+x.kicker+'</div><h1>'+x.title+'</h1><div class="detail-icon">'+x.icon+'</div></div><div class="content">'+x.html+'</div><button class="back" onclick="goHome()" aria-label="Back">'+icons.back+'</button><button class="menu-fab" onclick="goHome()" aria-label="Guest guide menu">'+icons.menu+'</button>';d.classList.add('active');window.scrollTo(0,0);if(replace)history.replaceState({page:id},'',location.pathname+'#'+id);else history.pushState({page:id},'',location.pathname+'#'+id)}
function openDetail(id){render(id,false)}
function goHome(){const d=document.getElementById('detail');d.classList.remove('active');d.innerHTML='';document.getElementById('home').style.display='block';window.scrollTo(0,0);history.pushState({},'',location.pathname)}
function copyPassword(){navigator.clipboard?.writeText('Welcome@123');const b=document.querySelector('.actions .dark');if(b){const old=b.textContent;b.textContent='Copied ✓';setTimeout(()=>b.textContent=old,1400)}}
function wifiConnect(){alert('Wi-Fi: UrbanNest_Guest\nPassword: Welcome@123')}
function switchTab(btn,id){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');document.getElementById(id).classList.add('active')}
window.addEventListener('popstate',()=>{const id=location.hash.slice(1);if(data[id])render(id,true);else{document.getElementById('detail').classList.remove('active');document.getElementById('detail').innerHTML='';document.getElementById('home').style.display='block'}});
window.addEventListener('DOMContentLoaded',()=>{const id=location.hash.slice(1);if(data[id])render(id,true)});
</script>
</body>
</html>
